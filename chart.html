<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weekly Downloads</title>
    <meta name="color-scheme" content="dark light">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="chart.css">
</head>

<body>
    <h1>Weekly Downloads of @wxn0brp/ Packages</h1>
    <div id="status" class="loading">Loading data...</div>

    <div id="controls" style="display: none;">
        <div class="controls-header">
            <button id="panelToggle" type="button" aria-expanded="true">Packages ▾</button>
            <div id="rangeSelect" role="group" aria-label="Time range">
                <button type="button" class="range-btn" data-days="7">7d</button>
                <button type="button" class="range-btn" data-days="30">30d</button>
                <button type="button" class="range-btn active" data-days="60">60d</button>
                <button type="button" class="range-btn" data-days="90">90d</button>
            </div>
        </div>
        <input type="text" id="searchBox" placeholder="Search packages...">
        <div class="list-actions">
            <button id="selectAll" type="button">Select all</button>
            <button id="selectNone" type="button">Select none</button>
            <h2>Packages (<span id="selectedCount">0</span> selected):</h2>
        </div>
        <div id="packagesList"></div>
    </div>

    <canvas id="downloadsChart"></canvas>
    <script src="dist/chart.js" type="module"></script>
</body>

</html>
